<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFA Auto Flow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Tailwind는 CDN 대신 PostCSS 빌드로 통합됨 (tailwind.config.js / index.css) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      body {
        /* BMW Type Next Latin 대체 스택(tailwind.config.js fontFamily.sans와 동일) */
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text',
          'Segoe UI', Roboto, 'Pretendard', 'Malgun Gothic', sans-serif;
        overscroll-behavior: none;
      }
      .canvas-bg {
        background-color: #000000; /* BMW M canvas — true black */
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 25px 25px;
      }
      .canvas-bg-light {
        background-color: #f9fafb; /* Light background */
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
        background-size: 25px 25px;
      }
      .panel-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .panel-scrollbar::-webkit-scrollbar-track {
        background: #e5e7eb;
      }
      .dark .panel-scrollbar::-webkit-scrollbar-track {
        background: #0d0d0d;
      }
      .panel-scrollbar::-webkit-scrollbar-thumb {
        background: #7e7e7e;
        border-radius: 0; /* rounded.none */
      }
      .dark .panel-scrollbar::-webkit-scrollbar-thumb {
        background: #3c3c3c;
      }
      .panel-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3c3c3c;
      }
      .dark .panel-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #7e7e7e;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
